name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: '--target x86_64-pc-windows-msvc --bundles nsis,msi'
          - platform: 'macos-15'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin --bundles dmg'
          - platform: 'macos-15-intel'
            target: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin --bundles dmg'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: '--target x86_64-unknown-linux-gnu --bundles deb,appimage'

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev build-essential curl wget file unzip

      - name: Install Node dependencies
        run: npm ci

      - name: Download platform sidecars
        run: node scripts/download-sidecars.mjs
        env:
          TAURI_TARGET: ${{ matrix.target }}

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test

      - name: Run backend tests
        run: cargo test --lib --target ${{ matrix.target }}
        working-directory: src-tauri

      - name: Build Tauri release bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Miles v__VERSION__'
          releaseBody: |
            ## What's changed
            - **System tray improvements** - A clearer tray menu and more reliable window restore behavior.
            - **Playlist cover sync** - Playlist artwork now follows the first track automatically.

            ## Downloads
            - [Windows (EXE Installer)](https://github.com/syans-OG/Miles-Music-App/releases/download/v__VERSION__/Miles___VERSION___x64-setup.exe)
            - [Windows (MSI Package)](https://github.com/syans-OG/Miles-Music-App/releases/download/v__VERSION__/Miles___VERSION___x64_en-US.msi)
            - [macOS (Apple Silicon)](https://github.com/syans-OG/Miles-Music-App/releases/download/v__VERSION__/Miles___VERSION___aarch64.dmg)
            - [macOS (Intel)](https://github.com/syans-OG/Miles-Music-App/releases/download/v__VERSION__/Miles___VERSION___x64.dmg)
            - [Linux (DEB Package)](https://github.com/syans-OG/Miles-Music-App/releases/download/v__VERSION__/Miles___VERSION___amd64.deb)
            - [Linux (AppImage)](https://github.com/syans-OG/Miles-Music-App/releases/download/v__VERSION__/Miles___VERSION___amd64.AppImage)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
