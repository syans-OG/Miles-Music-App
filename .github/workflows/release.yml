name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: '--target x86_64-pc-windows-msvc --bundles nsis,msi'
          - platform: 'macos-15'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin --bundles dmg'
          - platform: 'macos-15-intel'
            target: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin --bundles dmg'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: '--target x86_64-unknown-linux-gnu --bundles deb,appimage'

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev build-essential curl wget file unzip

      - name: Install Node dependencies
        run: npm ci

      - name: Download platform sidecars
        run: node scripts/download-sidecars.mjs
        env:
          TAURI_TARGET: ${{ matrix.target }}

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test

      - name: Run backend tests
        run: cargo test --lib --target ${{ matrix.target }}
        working-directory: src-tauri

      - name: Build Tauri release bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Miles v__VERSION__'
          releaseBody: |
            ## Features
            - **Theme Presets & Custom Color Wheel** - Pick curated Minimal, Emerald, or Sunset palettes, or dial in a one-of-a-kind accent with the custom color wheel. Themes flow across the player, drawer, dialogs, and widgets.
            - **Offline Queued Downloads** - A concurrency-managed download scheduler with live progress in the activity panel and safe overwrite handling.
            - **Opus Audio Preference** - YouTube streams now resolve to the efficient Opus (webm) codec when available, falling back to m4a only when needed; local `.opus` files are fully supported in your library.
            - **Import URL Autofill (Ctrl+V)** - Pasting a YouTube or Spotify link over the Import panel fills the URL and starts importing instantly - no Enter required.

            ## Performance & Polish
            - **Far Less Disk Churn** - Per-tick time updates no longer touch the persisted store; 5s checkpoint sync cuts storage writes from 288 to 18 during heavy playback (persisted-set time 438.5ms to 15.2ms).
            - **Lower Peak Memory** - Embedded cover decode capped at 1024px and stream hashing via `fs::copy` tame RAM spikes; the renderer JS heap is bounded and WebView2 background services are disabled.
            - **Smoother Large Libraries** - The Add Songs modal is now virtualized to stay fluid with thousands of tracks.
            - **Solid Cabinet in Floating Mode** - The drawer stays opaque even with Transparent enabled, now a dedicated ON/OFF toggle.
            - **Fully English UI** - Every user-facing string in the frontend and backend is in English.
            - **Silent Failures Surfaced** - Save quotas, cover write errors, media-proxy boundaries, and import details now report instead of failing quietly.

            ## Downloads
            - [Windows (EXE Installer)](https://github.com/syans-OG/Miles-Music-App/releases/download/v__VERSION__/Miles___VERSION___x64-setup.exe)
            - [Windows (MSI Package)](https://github.com/syans-OG/Miles-Music-App/releases/download/v__VERSION__/Miles___VERSION___x64_en-US.msi)
            - [macOS (Apple Silicon)](https://github.com/syans-OG/Miles-Music-App/releases/download/v__VERSION__/Miles___VERSION___aarch64.dmg)
            - [macOS (Intel)](https://github.com/syans-OG/Miles-Music-App/releases/download/v__VERSION__/Miles___VERSION___x64.dmg)
            - [Linux (DEB Package)](https://github.com/syans-OG/Miles-Music-App/releases/download/v__VERSION__/Miles___VERSION___amd64.deb)
            - [Linux (AppImage)](https://github.com/syans-OG/Miles-Music-App/releases/download/v__VERSION__/Miles___VERSION___amd64.AppImage)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
