name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: ''
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: ''

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev build-essential curl wget file

      - name: Install Node dependencies
        run: npm ci

      - name: Download platform sidecars
        run: node scripts/download-sidecars.mjs
        env:
          TAURI_TARGET: ${{ matrix.target }}

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test

      - name: Run backend tests
        run: cargo test --lib
        working-directory: src-tauri

      - name: Build Tauri release bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Miles v__VERSION__'
          releaseBody: |
            # 🎵 Miles Music Player v__VERSION__

            ### 🌟 What's New (Added)
            - **Studio Hero Inset (Playlist Detail View)**: Dedicated playlist detail view with high-res artwork, isolated tracklist, playback controls (Play All / Shuffle), and search modal to add songs directly from library.
            - **Playlist Rename**: Rename playlists directly in the detail view header.
            - **Multi-Select Batch Deletion**: Multi-selection mode for CD collection with floating action bar and safe file cleanup.
            - **Queue Controls Ribbon**: Icon buttons for Repeat Queue, Shuffle Upcoming Queue, and Clear Queue.
            - **Native Single Instance Lock**: Prevents duplicate running instances, restores and focuses from System Tray, with tactile visual nudge.
            - **Cross-Platform Matrix Release**: Official native packages for Windows, macOS, and Linux.

            ### 🔧 Bug Fixes & UI Polish (Fixed)
            - Fixed single track repeat loop pausing glitch.
            - Fixed Spotify & YouTube thumbnail resolution to prevent gray camera 404 placeholder covers.
            - Compact proportional UI scaling for Mode 1 (Console Bar), Mode 2 (Turntable), and Mode 3 (Micro Bubble).
            - Tightened desktop screen corner snapping (8px margin) and eliminated drawer bottom text clipping.
            - Removed outer shadows from Mode 3 floating bubble.

            ---
            ### 📥 Download & Installation Guide
            | Platform | Installer / Package | System Requirements |
            | :--- | :--- | :--- |
            | **Windows** | `Miles___VERSION___x64-setup.exe` / `.msi` | Windows 10/11 (64-bit) |
            | **macOS (Apple Silicon)** | `Miles___VERSION___aarch64.dmg` | macOS 11+ (M1 / M2 / M3 / M4) |
            | **Linux** | `Miles___VERSION____amd64.deb` / `.AppImage` | Ubuntu / Debian / Fedora / Arch |
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
