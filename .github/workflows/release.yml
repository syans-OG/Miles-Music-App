name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: ''
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: ''

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev build-essential curl wget file unzip

      - name: Install Node dependencies
        run: npm ci

      - name: Download platform sidecars
        run: node scripts/download-sidecars.mjs
        env:
          TAURI_TARGET: ${{ matrix.target }}

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test

      - name: Run backend tests
        run: cargo test --lib
        working-directory: src-tauri

      - name: Build Tauri release bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Miles v__VERSION__'
          releaseBody: |
            ## Features
            - **Studio Hero Playlist View** - Dedicated drill-down view for playlists with high-resolution artwork, tracklist manager, and integrated song search.
            - **Playlist Renaming** - Easily rename any playlist directly from the header without leaving the view.
            - **Multi-Select Batch Deletion** - Select and delete multiple tracks simultaneously from your CD collection with safe disk cleanup.
            - **Queue Control Ribbon** - Minimalist icon-only controls for Queue Repeat, Shuffle Upcoming Queue, and Clear Queue.
            - **Single Instance Lock & Tray Restore** - Native OS lock that restores and focuses the active window from the System Tray with a gentle visual nudge.

            ## Performance & Polish
            - **Ultra-Low Memory Footprint** - Optimized resource usage holding steady at 50–90MB RAM during continuous audio playback and stream resolution.
            - **Seamless Audio Loop** - Fixed audio loop pausing bug for continuous, zero-gap single track replay.
            - **Smart Artwork Resolution** - Reliable YouTube and Spotify thumbnail caching that prevents 404 placeholder covers.
            - **Refined 3-Mode Form Factors** - Calibrated sizes for Console Bar, Vinyl Turntable, and Micro Bubble with zero-shadow floating aesthetics.

            ## Downloads
            - [Windows (EXE Installer)](https://github.com/syans-OG/Miles-Music-App/releases/download/v__VERSION__/Miles___VERSION___x64-setup.exe)
            - [Windows (MSI Package)](https://github.com/syans-OG/Miles-Music-App/releases/download/v__VERSION__/Miles___VERSION___x64_en-US.msi)
            - [macOS (Apple Silicon)](https://github.com/syans-OG/Miles-Music-App/releases/download/v__VERSION__/Miles___VERSION___aarch64.dmg)
            - [Linux (DEB Package)](https://github.com/syans-OG/Miles-Music-App/releases/download/v__VERSION__/Miles___VERSION____amd64.deb)
            - [Linux (AppImage)](https://github.com/syans-OG/Miles-Music-App/releases/download/v__VERSION__/Miles___VERSION____amd64.AppImage)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
