[package]
name = "miles-music-player"
version = "1.0.7"
description = "A lightweight cross-platform music player for local audio and public YouTube links."
authors = ["syans-OG"]
license = "MIT"
repository = "https://github.com/syans-OG/Miles-Music-App"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "miles_music_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
lofty = "0.24"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
sha2 = "0.10"
tauri = { version = "2.11.3", features = ["protocol-asset", "tray-icon"] }
url = "2.5"
discord-rich-presence = "0.2.4"
once_cell = "1.19"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "default-tls"] }
tiny_http = "0.12"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging"] }
